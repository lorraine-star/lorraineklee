lessons:
  - title: "Prepare your ideas before you speak"
    description: "Preparing what you want to say ahead of a meeting or before a conversation will go a long way. Here's what to consider."
  - title: "Vary your tone of voice to communicate more effectively"
    description: "There are many different ways we can speak to communicate more effectively. Learn how to add vocal variety to your speech."
  - title: "Add value when you speak"
    description: "If you add value when you speak, you show others you're credible. Learn how to make sure you're adding value to any conversation."
  - title: "Stop rambling and get to the point"
    description: "It's important to share upfront why what you're saying is important. Here's how to get to the point quickly."
  - title: "Ask smart questions so others remember you"
    description: "Use questions to show you're someone to whom others should listen. Here's how to ask memorable questions."
  - title: "What to avoid when you speak"
    description: "Avoid common communication mistakes that can make you seem less credible. Here's what to look out for."
  - title: "Incorporate body language and nonverbal communication"
    description: "Leveraging body language will be an effective way to support your words. Learn how to make them work together so others pay attention."
  - title: "Speak with empathy"
    description: "Showing you understand others' concerns, feelings, and perspectives will make them more likely to listen. Here's how to tap into your empathetic side when you speak."
  - title: "Share a story to hook your audience"
    description: "Incorporating a theme or sharing an experience can hook listeners in. Learn how to use storytelling to your advantage."
  - title: "Speak up and support others"
    description: "Speaking up for others can often be easier than speaking up for yourself. Here's how you can start."
