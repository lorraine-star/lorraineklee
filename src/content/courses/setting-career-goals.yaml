    description: "Learn why effective career conversations are essential for professional growth and how they can lead to new opportunities. Understand the steps you can take to get started."
  - title: "Deciding your career goals"
    description: "Define specific, actionable, and measurable objectives to guide immediate and short-term career decisions."
