lessons:
  - title: "Your first few months"
    description: "Your first few months as a manager will be all about the meet and greet. Learn the key questions to ask your new team."
  - title: "Throw perfection out the door"
    description: "Every new manager will be faced with insecurities and concerns. Learn the best way to approach and tackle these with your new team."
  - title: "Manage meetings"
    description: "Team and one-on-one meetings set the tone for how you all operate together. Be intentional about how you structure this time to make the most of it."
  - title: "Practice swift trust"
    description: "Say goodbye to micromanaging and hello to trust. Embrace the concept of swift trust to work faster and smarter with your team."
  - title: "Advocate for your team"
    description: "Great managers are no longer just advocates for themselves. Follow these suggestions for how you can get your team’s work in front of senior leadership."
  - title: "The art of feedback"
    description: "Feedback is one of the best things a manager can give and receive. Learn how to move away from the compliment sandwich."
  - title: "Lead them to their next job"
    description: "It may sound counterintuitive, but the best managers set their team up for their next role—whether it be inside or outside of your company."
  - title: "Be thoughtful about schedules"
    description: "Being cognizant of your team’s schedules—both during and after work hours—will help you stand out as a manager. Here’s what to do."
  - title: "Share goals and expectations"
    description: "Your team will be happiest when they know what they’re working toward. Here’s what to focus on."
  - title: "Create your README"
    description: "Create your personal operating manual so your team knows exactly what to expect. Here’s how to do it."
