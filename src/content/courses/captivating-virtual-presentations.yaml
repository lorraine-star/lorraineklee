lessons:
  - title: "Virtual presentations vs. in-person presentations"
    description: "Virtual presentations aren't just about bringing your in-person presentations into a screen share. Watch this video to understand a few of the key differences."
  - title: "Make eye contact to connect with your virtual audience"
    description: "Eye contact will be one of the most important ways for you to connect on camera. Follow these suggestions for how to make eye contact that feels natural."
  - title: "Adjust your camera framing to exude competence"
    description: "Did you know that improper camera framing can actually make the person you're speaking to feel uncomfortable? Make these changes to your camera framing to create a better virtual experience."
  - title: "Incorporate body language when presenting virtually"
    description: "Body language is still a very important piece of virtual presentations—even if the audience can't see your whole body! Here's what to keep in mind."
  - title: "How to design better slides for virtual presentations"
    description: "When building your virtual presentation, you'll want to consider including these design elements. Here's what to think about as you build out your virtual presentation."
  - title: "How to know if your audience is engaged"
    description: "Getting feedback from your audience is tougher in a virtual space when often you're the only one with your camera on and everyone else is muted. Here are some ways to check in on how tuned in your audience is."
  - title: "Curate your environment before you present"
    description: "To come across as a competent and professional virtual presenter, you'll need to pay attention to not just yourself as the presenter, but your video presence. Learn simple ways to curate your environment."
  - title: "Add more energy when presenting virtually"
    description: "Virtual presentations can often be less engaging because video mutes energy on camera. Try these tips to ensure that your energy breaks through the screen."
  - title: "Effectively use pattern interrupts in your presentations"
    description: "Virtual audiences are often distracted, which means presenters will need to incorporate more pattern interrupts in order to recapture their attention. Learn what they are how to use them effectively."
  - title: "Practice and record your presentation"
    description: "When you practice and record your presentation, you'll improve more quickly. Learn what to look out for and how to practice effectively."
