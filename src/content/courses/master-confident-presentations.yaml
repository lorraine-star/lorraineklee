lessons:
  - title: "Why presentation skills are essential"
    description: "Get a preview of what this course covers and how to use it to become a more confident, captivating presenter—whether you're presenting in person or virtually."
  - title: "Why nerves are normal—and how to reframe them"
    description: "Understand why presentation anxiety is universal and learn how to shift your mindset from fear to fuel so nerves work for you instead of against you."
  - title: "Preparation as your confidence strategy"
    description: "Learn why preparation is the single most effective antidote to nerves and walk away with a practical framework for preparing in a way that builds genuine confidence."
  - title: "What to do when anxiety hits"
    description: "Discover concrete techniques for managing nerves in real time, so you can reset, refocus, and keep going when anxiety shows up on stage or on screen."
  - title: "Public speaking for introverts"
    description: "Discover why introversion is actually an asset in presentations and learn how to leverage your natural strengths like depth, preparation, and thoughtfulness to captivate any audience."
  - title: "Knowing your audience: The think-do-feel matrix"
    description: "Learn how to analyze your audience using the think-do-feel matrix, so every presentation decision, from content to tone, is anchored in what your audience actually needs."
  - title: "Structuring your talk: Key points and timing"
    description: "Learn how to build a clear, compelling presentation structure that keeps your audience oriented and your message on track without overloading your slides or your audience."
  - title: "Designing slides that support your message"
    description: "Understand the principles of effective slide design and learn how to create visuals that enhance your message rather than distract from it."
  - title: "How to open strong"
    description: "Learn the most effective techniques for grabbing your audience's attention in the first 60 seconds, so they're engaged before you've gotten through your first slide."
  - title: "How to close strong"
    description: "Discover how to end your presentation with impact, so your audience walks away remembering your message and knowing exactly what to do next."
  - title: "Creative strategies for keeping attention"
    description: "Learn how to maintain audience engagement from start to finish using strategic content movement, compelling visuals, and pattern interrupts that reset attention when it drifts."
  - title: "The 4 Ps: Pace, pitch, pause, and power"
    description: "Master the four vocal levers that transform how you come across as a speaker and learn how to use pace, pitch, pause, and power intentionally to command attention and convey confidence."
  - title: "Body language, gestures, and eye contact"
    description: "Demonstrate confident body language, intentional gestures, and effective eye contact during a presentation, so that your physical presence reinforces your message and builds trust with your audience."
  - title: "Virtual vs. in-person: Adjusting your delivery"
    description: "Understand how the fundamentals of delivery shift between in-person and virtual settings and learn practical adjustments for camera presence, energy, and engagement when you're not in the room."
  - title: "Applying these skills every day"
    description: "Learn how to use meetings, team calls, and everyday conversations as low-stakes practice reps, so that when the high-stakes moment arrives, confident delivery feels natural."
  - title: "AI tools for planning, scripting, and slide design"
    description: "Learn how to use AI tools to streamline your presentation prep—from generating outlines and refining your message to designing slides that look polished and professional."
  - title: "AI tools for practice, feedback, and Q&A prep"
    description: "Discover how to use AI as a rehearsal partner—including specific prompts for stress testing your talk, anticipating tough questions, and getting feedback on your delivery before you ever step on stage or go on camera."
  - title: "Dealing with technical problems and difficult moments"
    description: "Learn how to stay calm and in control when things go wrong, from tech failures to awkward silences, so you can recover gracefully and keep your audience's confidence in you intact."
  - title: "Mastering Q&A"
    description: "Learn how to handle questions with confidence, including tough, unexpected, or hostile questions, so Q&A becomes an opportunity to reinforce your credibility rather than a moment to dread."
  - title: "Challenge: Handling a hostile audience member"
    description: ""
  - title: "Solution: Handling a hostile attendee"
    description: ""
  - title: "Your confident presenter toolkit"
    description: "Walk away with a clear summary of the frameworks, tools, and techniques covered in this course and a practical plan for continuing to build your presenting skills one rep at a time."
