lessons:
  - title: "Reframe your feedback"
    description: "Looking at feedback through a different lens will make it a less intimidating experience. Here are a few approaches to try."
  - title: "Respond to feedback"
    description: "As difficult as it is to receive feedback, giving it can be just as challenging. Here’s how to respond when someone shares feedback with you."
  - title: "Find your feedback circle"
    description: "One of the best ways to get meaningful feedback is to find your feedback tribe. Learn how to find and approach them."
  - title: "The power of positive feedback"
    description: "Feedback shouldn’t just be about what to improve on. Positive feedback can be just as powerful. Learn how to give meaningful positive feedback."
  - title: "Be specific with your feedback"
    description: "In order to receive the best feedback possible, you need to get specific with it. Learn how to craft your feedback requests."
  - title: "Avoid the feedback sandwich"
    description: "It’s time to do away with the feedback sandwich. Here’s what to do instead."
  - title: "Follow the COIN feedback framework"
    description: "Great feedback focuses on the facts, not personality. Try this framework next time you need to give feedback."
  - title: "Be timely with your feedback"
    description: "Feedback will be most helpful if it’s timely. Learn how you can bring up feedback that improves performance."
  - title: "Written vs. verbal feedback"
    description: "If you want your feedback to be received well, you may need to deliver it in a different way. Here are a few ideas."
  - title: "Nonverbal feedback"
    description: "It’s not just what you say, but how you say it. Here are the nonverbal cues to keep in mind when sharing and receiving feedback."
