lessons:
  - title: "Why your AI drafts are hurting your reputation"
    description: "Identify how unedited AI output undermines professional credibility to understand why editing AI drafts is a nonnegotiable career skill."
  - title: "Red flag phrases to watch out for"
    description: "Identify the most common AI writing patterns that signal generic, low-effort communication to spot them in any draft before it goes out."
  - title: "How to diagnose a weak draft in under a minute"
    description: "Apply a fast diagnostic process to any AI-generated draft to know exactly where to focus your editing effort."
  - title: "Prompting with PACT: Purpose, audience, constraints, tone"
    description: "Write detailed prompts to ensure your AI drafts align closely with your needs and require minimal editing."
  - title: "Iterating until it actually sounds like you"
    description: "Refine AI output using follow-up prompts to create a draft that reflects your voice before completing your final edit."
  - title: "BLUF and headline-first writing"
    description: "Restructure AI-generated content using BLUF and headline-first formatting so that messages are immediately scannable for busy senior readers."
  - title: "Editing AI output for length"
    description: "Edit AI drafts to include only essential content, making your messages concise and respectful of your reader's time."
  - title: "Rewriting the parts AI always gets wrong"
    description: "Rewrite specific elements AI consistently gets wrong, such as openers, closers, and filler phrasing, to ensure your message sounds like it was written by a human."
  - title: "Set up AI to sound like you: Building your voice brief"
    description: "Create a reusable voice brief that captures your tone and style for every AI session to reference, reducing the need for edits."
