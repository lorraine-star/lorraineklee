lessons:
  - title: "Understanding decision-making"
    description: "Explore the basic principles of decision-making to better understand the factors that influence choices. Learn why recognizing these factors can lead to quicker and more effective decisions."
  - title: "Accountability in decision-making"
    description: "Learn how accountability affects decision-making and why it’s crucial for maintaining an action-oriented approach."
  - title: "Overcoming decision paralysis"
    description: "Identify common causes of decision paralysis and learn strategies to overcome it."
  - title: "Tools for quick decision-making"
    description: "Decision-making doesn't have to happen only in your head. Leverage practical tools and techniques that facilitate faster decision-making."
  - title: "Developing intuition for faster decisions"
    description: "Explore the role your intuition plays in decision-making, and why you should incorporate it when making judgment calls."
  - title: "The impact of emotions on decisions"
    description: "Explore how emotions influence decision-making, and equip yourself with strategies to manage emotional biases under pressure."
  - title: "Collaborative decision-making"
    description: "Examine the advantages of making decisions in a team setting and how collaboration can speed up the decision process."
  - title: "Communicating decisions effectively"
    description: "Learn how to communicate your decisions clearly and effectively to ensure alignment and prompt action. Discover why transparency in the decision-making process enhances team dynamics and efficiency."
  - title: "Learning from decision outcomes"
    description: "Not all decisions end up with your desired outcomes. Learn how to analyze decisions after the fact to improve future decision-making skills."
  - title: "How to think through decisions"
    description: "Not all decisions are equal. Learn how to assess the decision in front of you and evaluate the different factors to consider."
