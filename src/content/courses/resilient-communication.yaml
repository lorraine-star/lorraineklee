lessons:
  - title: "Preparing for a difficult conversation"
    description: "Before going into any difficult conversation, you first need to make sure you've thoroughly prepared. Learn techniques for assessing a situation and determining what you'll say."
  - title: "When you're caught off guard"
    description: "No matter how much we prepare, sometimes we're caught off guard. In this video, explore how you can maintain your composure and communicate clearly, even when you are confronted with a conversation you weren't expecting."
  - title: "Conflict resolution strategies"
    description: "To resolve conflict, it's important that all parties feel supported and heard. Dive into how to understand underlying issues and implement collaborative problem-solving."
  - title: "How to overcome nerves"
    description: "It's natural to feel nervous when communicating in different scenarios. This video teaches you helpful techniques to calm your nerves and help you to stay focused so that you communicate clearly and effectively."
  - title: "Communicating in high-stress situations"
    description: "Workplaces are not immune from high-stress situations, including crisis situations or heated debates. This video delves into ways to keep your communications positive and impactful even in stressful scenarios."
  - title: "Common communication mistakes"
    description: "Avoid common communication pitfalls that hurt your credibility as a strong communicator. In this video, learn what to steer clear of."
  - title: "Virtual conversation skills"
    description: "Sometimes communicating delicate or sensitive topics will need to happen in a virtual setting. Dive into strategies to handle these conversations with tact and care."
  - title: "Sharing difficult news"
    description: "Conveying tough news is more than just about the words you choose. Learn the nuances of sharing difficult news with other key factors like timing and the setting so that your message is received in the way it's intended."
  - title: "Responding to negative feedback"
    description: "Receiving negative feedback is never easy, but there is a right way and a wrong way to respond. Learn the strategies for responding professionally and with grace when faced with criticism."
  - title: "Closing tough conversations positively"
    description: "Difficult conversations can still end on a positive note. Learn ways that you can ensure all parties have an optimistic outlook moving forward."
