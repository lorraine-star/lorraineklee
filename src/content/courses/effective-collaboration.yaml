duration: ""
lessons:
  - title: "Establish clear goals, expectations, and priorities"
    description: "Without a clear road map, productive collaboration will be ineffective. Learn what you need to lay a helpful foundation."
  - title: "Assign and define clear roles for successful collaboration"
    description: "Collaborating means everyone working together to achieve a goal. Learn how to make sure roles and responsibilities are clear."
  - title: "Create systems that boost team productivity"
    description: "If the team is aligned on the same systems and processes, work can get done more efficiently. Learn what to think about when setting up your group's systems."
  - title: "Conduct pre-mortems and retrospectives"
    description: "Predicting what can go wrong before a project starts—and analyzing what went wrong after—are two key components of any successful collaboration. Learn what to think about when planning yours."
  - title: "Focus on cross-functional alignment"
    description: "Cross-functional work is at the heart of collaboration."
  - title: "Online collaboration tools and software for teams"
    description: "An increasing number of tools are flooding the market to help support collaboration, both virtually and in person. Discover a few to check out."
  - title: "Create a safe space for your team"
    description: "Building a safe space for teammates to share ideas, give honest feedback, and take risks will improve collaboration. Learn how to create a psychologically safe environment."
  - title: "Communicate often with cross-functional partners"
    description: "Communication is one of the cornerstones of strong collaboration. Consider these factors if you want to communicate successfully with your team."
  - title: "Celebrate your team's successes"
    description: "Boost team morale and acknowledge project progress when you celebrate their success. Discover a few ways to do it."
  - title: "Address conflict quickly"
    description: "Conflict is bound to come up when you put a bunch of different groups and personalities together—but it doesn't have to halt your progress. Learn how to turn conflict into collaboration."
