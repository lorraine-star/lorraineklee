title: Nano Tips for Delegating as a Manager
category: Management
order: 2
rank: 11
description: Delegate tasks and responsibilities effectively, whether you're a new or experienced manager.
url: https://www.linkedin.com/learning/nano-tips-for-delegating-as-a-manager-with-lorraine-k-lee
glyph: D
thumbnail: "/images/v1/courses/delegating-as-a-manager.webp"
duration: ""
lessons:
  - title: "Why managers need to delegate"
    description: "One of the biggest transitions from individual contributor to manager is the need to delegate. Great managers need to be great delegators—here's why."
  - title: "Overcoming delegation challenges"
    description: "Delegation isn't just something you learn overnight. It takes practice and you may face some challenges along the way. Here are the common ones to watch out for."
  - title: "Deciding which tasks to delegate"
    description: "Think through these key questions to figure out what exactly you should be delegating—and to whom—so that work continues to move forward productively."
  - title: "Delegating tasks to your team"
    description: "Just because you're someone's manager doesn't mean you can delegate work without a second thought. Make sure to think through these things before delegating tasks to direct reports."
  - title: "Setting clear expectations when you delegate"
    description: "Whether the work you delegate gets done well and on schedule will depend greatly on the expectations you set from the start. Keep these things in mind next time you delegate."
  - title: "Create accountability after delegating"
    description: "Once you delegate work, it doesn't mean that the work is off your plate. You'll still need to check in with your team and hold them accountable. Here's how to do it effectively."
  - title: "Focus on results when delegating"
    description: "When you delegate work to someone else, it'll often be done differently than you would have done it—and that's OK! Learn why you should focus on results and less so on how the work gets done."
  - title: "Addressing mistakes and offering constructive feedback"
    description: "Even if you delegate work, the final work product is ultimately your responsibility. Learn the importance of checking over work and what to do if you catch a mistake."
  - title: "Use delegation to develop employees"
    description: "One of a manager's most important responsibilities is to grow and develop their employees. Learn why delegation is a key piece of their development."
  - title: "Delegating work to peers"
    description: "Sometimes you'll have to delegate work to a peer even though you don't have any authority over them. Here's how to frame your requests so that the work gets done and you maintain a positive working relationship."
