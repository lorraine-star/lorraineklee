lessons:
  - title: "The power of positive leadership"
    description: "Leading with positivity can lead to outsized positive results, including more risk-taking by teams and better talent retention. Learn about why this style of leadership is so important for leaders to embrace."
  - title: "Creating a positive work environment"
    description: "Creating a culture where employees feel valued and empowered is key to productivity and a happier workforce. Use these strategies to positively influence your company culture."
  - title: "Positive communication for leaders"
    description: "Communication is at the heart of our workplaces. Learn how to listen actively, embrace positive language, and share constructive feedback."
  - title: "Positive body language"
    description: "Your positive leadership will be most impactful if your body language aligns with what you say. Consider these factors for positive leadership when it comes to non-verbal communication."
  - title: "Tackling challenges and adversity with positivity"
    description: "Challenges and roadblocks are inevitable in a workplace. Learn how positivity can help you move past any difficult moments."
  - title: "Confront negativity"
    description: "Being a positive leader doesn't mean ignoring negativity. You'll need to tackle it head on — here's how."
  - title: "Fostering positivity amongst teams"
    description: "Trust, collaboration, and inclusivity are just a few of the qualities you'll need to foster among teams when leading with positivity. Here are a few ideas you can use to get started."
  - title: "Lead with empathy"
    description: "Empathy and emotional intelligence are essential aspects to positive leadership. Learn how to show others that you are compassionate and care about their well-being."
  - title: "Advocate for your employees"
    description: "Being a leader means advocating and speaking up for your team. Learn how you can be their biggest champion."
  - title: "Leading positively through change"
    description: "Change can be unsettling, but positive leadership can ease those transitions. Here's how."
