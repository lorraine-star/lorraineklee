title: Nano Tips for Navigating Life After a Layoff
category: Career
order: 6
rank: 23
description: Process the moment, lean on your network, and optimize your LinkedIn presence to attract recruiters after a layoff.
url: https://www.linkedin.com/learning/nano-tips-for-navigating-life-after-layoff-with-lorraine-lee
glyph: L
thumbnail: "/images/v1/courses/navigating-life-after-layoff.webp"
duration: ""
lessons:
  - title: "Feel your emotions after a layoff"
    description: "Getting laid off is a traumatic event. These are the emotions you're likely to feel—and how to handle them."
  - title: "Stay positive after a layoff"
    description: "It's natural to enter a negative self-talk spiral post-layoff. Follow these suggestions to shift your mindset."
  - title: "Career planning after a layoff"
    description: "What you did in your previous role doesn't need to be what you do in your next one. Here's how to think through the next stage of your career."
  - title: "Share your layoff story"
    description: "One of the best ways to let people know you're open to work is by making a post about it on LinkedIn. Here's how to write an effective post that will be seen by many."
  - title: "Leverage your network after a layoff"
    description: "Your network will be one of the most important ways to learn about and get referred to new roles. Here's how to approach them for help."
  - title: "Set up informational interviews"
    description: "Connect with people who work at companies you're interested in or who are in similar roles you want to be hired for. Here's how to approach strangers who can help you with your job search."
  - title: "Ask for recommendations"
    description: "After getting laid off, one of the first things you should do is ask for recommendations from former colleagues. Here's how to ask for recommendations that will help you land your next job."
  - title: "Avoid job application burnout"
    description: "Applying to hundreds of jobs per day may make you feel more productive, but it's actually working against you. Here's how to approach your job search strategically."
  - title: "Write down your accomplishments"
    description: "Jot down your wins and accomplishments while they're still fresh in your mind. Here are a few frameworks that can help."
  - title: "Leverage LinkedIn after a layoff"
    description: "Leverage LinkedIn so that you can get found by more recruiters and hiring managers. Here's what to do to make sure you're optimizing your job search."
