lessons:
  - title: "Understanding self-motivation"
    description: "Understand why mastering this skill is crucial for personal and professional success."
  - title: "Identifying your motivators"
    description: "If you want to motivate yourself effectively, you need to identify the personal and professional motivators that drive you. Here's how to do it."
  - title: "Setting achievable goals"
    description: "Learn how to set realistic and attainable goals that are aligned with your motivators so that you can make progress towards your larger goals and feel a sense of accomplishment."
  - title: "Strategies to boost your motivation daily"
    description: "Gain practical strategies to boost your daily motivation, ensuring consistent progress towards your goals."
  - title: "Overcoming bad days, procrastination, and setbacks"
    description: "Develop resilience by learning techniques to overcome procrastination, manage bad days, and bounce back from setbacks."
  - title: "The role of physical wellbeing"
    description: "Understand how physical health impacts your motivational levels and learn ways to incorporate wellness into your routine to keep you on track."
  - title: "Embracing positive affirmations"
    description: "Positive affirmations can have a stronger effect on your day-to-day than you might think. Learn the power of positive affirmations in enhancing self-confidence and motivation, and how to integrate them into daily life."
  - title: "Celebrating small wins"
    description: "Recognize the importance of acknowledging and celebrating small achievements to maintain high motivation levels over time."
  - title: "Cultivating a growth mindset"
    description: "Understand the benefits of a growth mindset for continual learning and motivation, and strategies to cultivate it."
  - title: "Avoid the comparison trap"
    description: "It's natural to want to compare ourselves to those around us, but here's why you should avoid it."
