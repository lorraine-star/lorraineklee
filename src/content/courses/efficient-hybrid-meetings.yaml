lessons:
  - title: "Create agendas to boost participation and drive results"
    description: "Without agendas, meetings are unfocused and unproductive. Learn how to create one that your team will thank you for."
  - title: "Define the rules of engagement"
    description: "Rules of engagement have never been more important than in a hybrid meeting. In this video, learn why and how you can use these rules to create a more inviting, inclusive meeting."
  - title: "Turn passive meetings to active"
    description: "Presentations are a cornerstone of meetings. In today's workplace—where distractions are abundant—, presentations also need to change with the times to capture audience's attention."
  - title: "Follow a framework to improve meeting outcomes"
    description: "These days, meeting facilitation is a skill in and of itself. Showing up and starting the call is not nearly enough. Follow this step-by-step guide to host a successful meeting."
  - title: "Create presentations that pop"
    description: "Asynchronous communication is still underutilized, particularly in virtual-first and hybrid workplaces. Learn how to change that so that you save time and add flexibility to your day."
  - title: "Avoid the pitfalls of proximity bias"
    description: "Proximity bias is cropping up as a concern more frequently in hybrid offices. In this video, learn how to be more aware of it and create an equal playing field for each teammate."
  - title: "Collaborate with intention"
    description: "To get everyone on the same page, hybrid meetings need to include tools everyone can use, such as virtual collaboration tools. Learn about why these tools are so important."
  - title: "Boost productivity with asynchronous communication"
    description: "With many companies shifting to hybrid or virtual-first models, the screen should no longer be the default. Learn how to keep the human element in meetings through content."
  - title: "Define post-meeting action items"
    description: "What you do after a meeting is just as important as what you do before and during it. Watch to learn how to build trust with your team and ensure that work gets done on time."
  - title: "Learn how to give and receive meeting feedback"
    description: "Feedback is one of the best ways to grow and learn, particularly when it comes to meetings. In this video, learn how to solicit meaningful feedback."
