lessons:
  - title: "Know your manager's goals"
    description: "Many people assume they know what's important to their boss, but that's not often the case. Here's how to get to the heart of what's important so you can better align your goals to theirs."
  - title: "Manage expectations"
    description: "It's easy to want to say \"yes\" to everything your manager asks of you, but it's important to manage expectations to maintain trust, set expectations, and avoid burnout. Here's how."
  - title: "Understand your manager's working style"
    description: "Is your boss a micromanager? Do they prefer email over Slack? Ask these questions and more to understand your boss' working style so you can calibrate your approach."
  - title: "Offer solutions, not problems"
    description: "Providing recommendations is one of the most important things you can do when managing up. Here's why."
  - title: "It's OK to disagree with your manager"
    description: "Push back on your manager respectfully when what they're asking doesn't align with company goals. Learn how to do it tactfully."
  - title: "Build rapport with your manager"
    description: "Get to know each other on a more personal level to build your relationship. Here are a few ways you can get to know each other better and show you care."
  - title: "Communicate often with your manager"
    description: "Communicate early and often so your manager isn't met with any surprises. Here's how."
  - title: "Be empathetic with your manager"
    description: "Being empathetic to a manager will take you far. Here's how to put yourself in your manager's shoes."
  - title: "Respect your manager's time"
    description: "Find out when and how your boss wants to receive information and answer questions. Here's how to plan your touchpoints accordingly."
  - title: "Anticipate your manager's needs"
    description: "Be the trusted colleague who can be thoughtful and proactive about anticipating your manager's needs. Here's how."
