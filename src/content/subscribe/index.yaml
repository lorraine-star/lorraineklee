eyebrow: Weekly Newsletter
headline: Stop being the
headline_accent: best-kept secret at work.
lead: >-
  Career Bites is the weekly newsletter 66,000+ professionals read on email and
  LinkedIn to get the recognition they deserve.
intro: >-
  You do great work, but the people who decide promotions don't know it. Every
  Wednesday I send one short email on how to say what you do without bragging,
  show up on LinkedIn without feeling salesy, and get on the radar of senior
  leaders. Written for introverts and people who hate self-promotion. ;)
benefits_heading: What you'll get
benefits:
  - How to talk about your wins so people listen
  - What to post on LinkedIn so opportunities find you
  - How to get known by the people who decide your next promotion
  - Behind-the-scenes lessons from my own career
byline: >-
  Written by [Lorraine K. Lee](https://linkedin.com/in/lorraineklee), former
  founding editor at LinkedIn, author of the bestseller *[Unforgettable
  Presence](https://amzn.to/3Hdv79r)*®, instructor on MasterClass and LinkedIn
  Learning, and LinkedIn Top Voice with more than 340,000 followers.
hero_image: /images/subscribe/signup-card.jpg
hero_image_alt: Lorraine K. Lee at her laptop beside a stack of her book Unforgettable Presence
testimonials_eyebrow: From readers
