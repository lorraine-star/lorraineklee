intro: >-
  You do great work, but the people who decide promotions don't know it. Every
  Wednesday I send one short email on how to say what you do without bragging,
  show up on LinkedIn without feeling salesy, and get on the radar of senior
  leaders. Written for introverts and people who hate self-promotion. ;)
