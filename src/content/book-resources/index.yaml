author_section:
  eyebrow: About the author
  book_title: Unforgettable Presence
  book_subtitle: Get Seen, Gain Influence, and Catapult Your Career
  bio: >-
    Lorraine K. Lee is an award-winning keynote speaker and the bestselling
    author of Unforgettable Presence® — a Next Big Idea Club must-read, a #1
    Amazon bestseller, and named a top career book by Entrepreneur magazine.


    She's on a mission to help talented professionals build an unforgettable
    presence — so they get recognized, get promoted, and become impossible to
    overlook. She has spoken at Fortune 500 companies and organizations
    including Zoom, Amazon, Cisco, and McKinsey & Company.


    With over 340,000 LinkedIn followers and recognition as a LinkedIn Top
    Voice in workplace communication and presence, Lorraine's reach extends
    beyond the stage. She's taught at MasterClass, Stanford Continuing Studies,
    and LinkedIn Learning, where she's reached over half a million learners.


    Before starting her own company, Lorraine spent over a decade in tech,
    including as a founding editor at LinkedIn. Lorraine has been featured in
    media outlets including CNBC, CNN, Bloomberg, and Financial Times.


    She received her BSJ from Northwestern's Medill School of Journalism.
  photo: /images/book-resources/about-the-author.webp
