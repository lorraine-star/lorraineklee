author_section:
  eyebrow: About the author
  book_title: Unforgettable Presence
  book_subtitle: Get Seen, Gain Influence, and Catapult Your Career
  bio: >-
    Lorraine K. Lee is a keynote speaker and the bestselling author of
    Unforgettable Presence: Get Seen, Gain Influence, and Catapult Your Career
    (Wiley). She also teaches popular courses at Stanford Continuing Studies and
    LinkedIn Learning. She is passionate about empowering leaders to elevate
    their presence, influence, and impact. Her frameworks have been adopted by
    globally recognized organizations like Zoom, Amazon, Cisco, and McKinsey &
    Company. Lorraine is recognized as a LinkedIn Top Voice with hundreds of
    thousands of followers, and previously spent over a decade as a founding
    editor at companies including LinkedIn and Prezi. Her insights are featured
    in top media outlets including CNBC, Bloomberg, and Fast Company.
  photo: /images/book-resources/about-the-author.webp
