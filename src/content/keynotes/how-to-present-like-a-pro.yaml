title: How to Present Like a Pro
order: 6
format: Keynote / Workshop
description: >-
  Presentations are undoubtedly a cornerstone of business and will continue to
  be an essential way to share your ideas, gain buy-in, impress leadership, and
  ultimately help you stand out and succeed.


  But for many, public speaking is the last thing they want to do. For those who
  do take the plunge, they're riddled with anxiety and nerves. On top of that,
  virtual presentations present their own new set of challenges, both in terms
  of delivery and the content itself.


  How do we stand out and break through the noise?


  Join Lorraine, who brings her experience from presentation platform
  powerhouses including SlideShare and Prezi, and discover strategies and
  frameworks to present with confidence and create virtual presentations that
  capture audience attention and inspire change and action.
takeaways:
  - How to feel and project confidence in your next presentation.
  - Tips to keep your audience engaged from open to close.
  - Best practices to build and deliver presentations that land.
