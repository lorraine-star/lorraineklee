title: Stand Out in the Age of AI
order: 1
format: Keynote / Workshop
description: >-
  AI can enhance your work—but it can't replace how you show up. In today's
  workplace, where outputs are increasingly similar, your presence is your
  greatest competitive advantage. Whether you're interviewing, positioning
  yourself for promotion, or building your personal brand, how you communicate
  your impact and connect with others is what sets you apart.


  Join Lorraine K. Lee—keynote speaker, bestselling author of Unforgettable
  Presence, and Stanford instructor—for actionable frameworks to stand out in an
  AI-driven environment: make your work visible with the lighthouse moment
  framework, command attention through video presence and vocal delivery, craft
  a unique and powerful introduction, and build your career brand on LinkedIn.
takeaways:
  - >-
    Apply the lighthouse moment framework to share work with key stakeholders
    without coming across as self-promotional.
  - >-
    Use framing, eye contact, body language, and pitch to command attention on
    camera and in meetings.
  - >-
    Develop a UPI that clearly communicates who you are, what you do, and why it
    matters.
  - >-
    Build a memorable career brand through intentional, high-quality LinkedIn
    engagement.
