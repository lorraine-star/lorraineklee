why_section:
  eyebrow: "Why these courses"
  heading: "Tactics you can"
  heading_accent: "use on Monday"
  lead: "Every course is built around concrete moves: scripts, frameworks, and small habits that compound across your week, not just your watch history."
  points:
    - title: "Communicate more clearly"
      description: "Trim the filler, lead with the point, and say less but mean more."
    - title: "Build quiet confidence"
      description: "Show up grounded in meetings, on calls, and in the rooms that matter."
    - title: "Manage up, and across"
      description: "Get your boss, your peers, and your team rowing in the same direction."
    - title: "Lead better meetings"
      description: "Run hybrid meetings people actually want to attend, and that move work forward."
    - title: "Improve your virtual presence"
      description: "Look, sound, and read as credible on every video call."
    - title: "Stand out at work"
      description: "Get credit for the work you're already doing, even if you hate self-promotion."
