author: Desirée McConnell
quote: >-
  We recently had the pleasure of partnering with Lorraine for an Executive Presence session at 1Password as part of our Asian & Pacific Islander Heritage Month programming, and it was one of our highest-rated speaker events of the year. Lorraine has a rare ability to make executive presence feel practical, approachable, and actionable. Rather than treating it as something reserved for high-stakes moments or senior leaders, she shared a fresh framework that empowered attendees at every career stage to strengthen their communication, credibility, and career brand through everyday interactions.
