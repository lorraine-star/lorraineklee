author: Orlana Darkins Drewery
quote: >-
  I almost skipped Lorraine’s training because I thought my audience wasn’t on LinkedIn—but I’m so glad I showed up. Lorraine was engaging, personable, and gave us practical, hands-on strategies I could apply immediately. Writing copy live, improving headlines, and getting real-time feedback was eye-opening and confidence-building. This was one of the most valuable sessions Ive attended, and I’ve already recommended Lorraine to a national women’s organization.
