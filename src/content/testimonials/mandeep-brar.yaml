author: Mandeep Brar
quote: >-
  What stood out most was how engaging, personable, and actionable Lorraine was as a speaker. I especially appreciated the thoughtful real-time feedback she gave attendees on their on-camera presence and communication style. It made the session feel highly interactive and personalized rather than just another presentation. The session was absolutely a worthwhile use of time, and I left with practical strategies I could immediately apply in my day-to-day work. I enjoyed it so much that I continued attending additional sessions afterward.
