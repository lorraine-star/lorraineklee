author: Christelle Mombo-Zigah
quote: >-
  Despite being very active on LinkedIn in order to network and build my brand, I learned a lot of new tips from Lorraine, such as the confirmation that LinkedIn is no longer only a job site and that it is accepted to share more personal perspectives, or the Duchenne smile on the profile picture as a way to look more personable. Lorraine shared a lot of pragmatic information that I will continue to apply to optimize my LinkedIn profile and to create content.
