author: Michelle Li
quote: >-
  Her presentation was interactive and engaging, and tips were highly actionable and easily digestible. She received high ratings in post-event survey results (attendees learned something new, was a valuable use of their time, and would take action after the session). Lorraine was extremely easy to work with leading up to the event. She always responded in a timely manner and shared an outline of the talk so I was able to pick and choose the parts I thought would be most impactful to include for our audience.
