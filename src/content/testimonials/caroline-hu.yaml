author: Caroline Hu
quote: >-
  I had the pleasure of participating in Lorraine's workshop, "Supercharging Your Executive Presence," at the SASE Asian Women in Tech Conference. Lorraine was an engaging, clear, and interactive speaker; throughout her workshop, we covered topics ranging from how to strengthen our communication and credibility to building our career brand. I highly recommend Lorraine as a skilled facilitator and workshop speaker!
