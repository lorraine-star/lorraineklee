about:
  eyebrow: A comprehensive guide
  heading: Leveraging LinkedIn with
  heading_accent: Lorraine K. Lee.
  body: >-
    I'm Lorraine Lee, and I've designed this guide for you, the busy
    professional who wants to be seen and heard on LinkedIn but isn't sure where
    to start.


    This isn't your average, dry e-book with repetitive content and a bunch of
    buzzwords. It's the culmination of my experience from working 6 years as a
    LinkedIn editor, and now as a Learning Instructor, teaching hundreds of
    thousands of people how to leverage and build a presence online that makes
    you more recognized, influential, successful, and empowered.


    First impressions matter, especially online. If your LinkedIn profile isn't
    working for you, it might be working against you. This guide will show you
    exactly how to craft a standout presence that gets the attention of
    recruiters, clients, buyers, and beyond.
sections_section:
  eyebrow: What you'll learn
  heading: Four sections, start
  heading_accent: to finish.
sections:
  - title: Optimize your profile
    description: >-
      When people want to learn more about you, recruiters, potential clients
      and buyers, your LinkedIn profile is the first place they'll look. I'll
      help you create an all-star profile that sets the foundation to enhance
      your presence on LinkedIn.
  - title: Grow your thought leadership
    description: >-
      You want people to take one look at your profile and know you're the real
      deal. That's where I come in with ideas for creating organic content
      that's engaging and easy to follow. You'll also get access to my favorite
      templates and post structures.
  - title: Connect and engage
    description: >-
      LinkedIn shouldn't be a digital rolodex of people you've already met. The
      best opportunities come from interacting with new people. Use my
      pre-written messages and lesser-known strategies to get your requests
      accepted and start building new relationships right away.
  - title: Bonus unconventional tips
    description: >-
      A bonus section of the less obvious moves that make you stand out, drawn
      from six years inside LinkedIn and 15+ LinkedIn Learning courses.
