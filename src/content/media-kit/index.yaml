bios_section:
  eyebrow: Approved bios
  heading: Copy-and-paste
  heading_accent: bios.
bios:
  - length_label: Short — 50 words
    text: >-
      Lorraine K. Lee is a keynote speaker and the bestselling author of
      Unforgettable Presence®. She teaches on LinkedIn Learning and MasterClass,
      and was a founding editor at LinkedIn. She speaks at global organizations
      including Cisco, McKinsey, and Zoom, and has been featured in CNBC, CNN,
      Bloomberg, and Financial Times.
  - length_label: Medium — 100 words
    text: >-
      Lorraine K. Lee is an award-winning keynote speaker and the best-selling
      author of Unforgettable Presence®. She is also an instructor with LinkedIn
      Learning, Stanford, and MasterClass.


      She’s on a mission to help talented leaders build an unforgettable
      presence — so they get recognized, get promoted, and become impossible to
      ignore. Lorraine has been featured in media outlets including CNBC, CNN,
      Forbes, Bloomberg, Fast Company, and Financial Times.


      Lorraine is recognized as a LinkedIn Top Voice with hundreds of thousands
      of followers, and previously spent over a decade as a founding editor at
      companies including LinkedIn and Prezi. 
  - length_label: Long — 250 words
    text: >-
      Lorraine K. Lee is an award-winning keynote speaker and the bestselling
      author of Unforgettable Presence® — a Next Big Idea Club must-read, a #1
      Amazon bestseller, and featured in Entrepreneur's Must-Read Career Books
      of 2025.


      She’s on a mission to help talented leaders build an unforgettable
      presence — so they get recognized, get promoted, and become impossible to
      ignore. She brings that mission to Fortune 500 companies and globally
      recognized organizations including Zoom, Amazon, Cisco, and McKinsey &
      Company.


      With over 300,000 LinkedIn followers and recognition as a LinkedIn Top
      Voice in workplace communication and presence, Lorraine’s reach extends on
      the stage and beyond. She teaches popular courses at MasterClass, Stanford
      Continuing Studies, and LinkedIn Learning, bringing her frameworks to a
      large global audience.


      Before starting her own company, Lorraine spent over a decade as a
      founding editor at top tech firms including LinkedIn and Prezi, where she
      worked on core products including the LinkedIn Daily News module and
      LinkedIn Newsletters.


      Lorraine has been featured in media outlets including CNBC, CNN, Forbes,
      Bloomberg, Fast Company, and Financial Times.


      She received her BSJ from Northwestern’s Medill School of Journalism and
      currently resides in San Francisco.
