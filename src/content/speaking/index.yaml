other_talks:
  - title: 'Make a Memorable First Impression On Video: The TEA Method'
    note: 'Bonus: a TEA Method checklist to make sure you''re set up for success.'
    format: Keynote / Workshop
    gif: /images/speaking/keynotes/tea-method.webp
    gif_alt: Lorraine K. Lee presenting the TEA Method for video calls
    description: >
      When getting on a video call with partners, teammates, or clients, first
      impressions matter. But with less physical space to make an impression and
      more factors to consider, like tech malfunctions and Zoom fatigue,
      standing out online can feel more difficult and overwhelming than it does
      in person.


      The reality: once you're equipped with a few key pieces of information and
      frameworks, you'll be ready to stand out in a virtual world.


      Join Lorraine, a top-rated virtual speaker and video communications
      expert, who will distill everything she's learned in an easily digestible
      way with tips you can implement right after the session.
    takeaways:
      - What the TEA Method is and how it can help you capture attention.
      - Ways to appear more professional, memorable, and confident on video.
      - How to create the perfect video setup.
  - title: How To Present Like a Pro
    format: Keynote / Workshop
    gif: /images/speaking/keynotes/present-like-a-pro.webp
    gif_alt: Lorraine K. Lee presenting on stage
    description: >
      Presentations are undoubtedly a cornerstone of business and will continue
      to be an essential way to share your ideas, gain buy-in, impress
      leadership, and ultimately help you stand out and succeed.


      But for many, public speaking is the last thing they want to do. For those
      who do take the plunge, they're riddled with anxiety and nerves. On top of
      that, virtual presentations present their own new set of challenges, both
      in terms of delivery and the content itself.


      How do we stand out and break through the noise?


      Join Lorraine, who brings her experience from presentation platform
      powerhouses including SlideShare and Prezi, and discover strategies and
      frameworks to present with confidence and create virtual presentations
      that capture audience attention and inspire change and action.
    takeaways:
      - How to feel and exude confidence during your next presentation.
      - Why presenting virtually is different, and how to leverage its benefits.
      - >-
        The 5-Step Presentation Attention Framework to build and deliver a
        captivating and persuasive presentation.
  - title: Communicate with Confidence In a Virtual World
    format: Keynote / Workshop
    gif: /images/speaking/keynotes/stanford-class.webp
    gif_alt: Lorraine K. Lee teaching a virtual communication session
    description: >
      In today's dynamic business landscape, virtual communication has become
      the norm, transforming the way we connect, collaborate, and achieve
      success.


      While this shift offers unparalleled flexibility and reach, it also
      presents unique challenges in captivating attention and making a lasting
      impression.


      You're not alone if you feel that communicating effectively through a
      screen can feel challenging. Without the right strategies, it's easy to
      get lost among the sea of video calls and remote meetings.


      Join top-rated virtual speaker, virtual presence expert, and LinkedIn
      Learning Instructor Lorraine K. Lee as she unveils the secrets to
      mastering the virtual stage, whether you're leading a team meeting,
      delivering a webinar, or pitching to clients, so that you exude confidence
      and professionalism knowing that you're presenting your best self in a
      virtual world.
    takeaways:
      - How to appear more confident and competent on video.
      - Tips and tricks to keep your audience engaged with your content.
      - Best practices to optimize your video presence.
  - title: 'How to Stand Out Virtually: Video and LinkedIn Essentials'
    format: Webinar / Workshop
    gif: /images/speaking/keynotes/present-like-a-pro.webp
    gif_alt: Lorraine K. Lee presenting on video and LinkedIn
    description: >
      In a world that's increasingly relying on video, knowing how to present
      yourself and your message over video is going to be critical to your
      success. The problem is, being on video can be scary and overwhelming.


      Fortunately, with a few simple tips, you can ensure that you stand out,
      whether you're leading a team meeting, hosting a webinar, presenting on
      the virtual stage, or building your brand on social media sites like
      LinkedIn.


      Join Lorraine K. Lee, a top-rated virtual keynote speaker, former LinkedIn
      editor, and popular LinkedIn Learning Instructor, for a webinar designed
      to help you become a more effective virtual presenter.
    takeaways:
      - How to be more confident on video and keep your audience engaged.
      - Best practices for video meetings and events.
      - >-
        Tips and tricks for sharing video content on LinkedIn to reach a larger
        audience.
