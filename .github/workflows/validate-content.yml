name: Validate content

# Two guards, run on pushes to main/dev and on pull requests:
#
# 1. keystatic-images -- the Keystatic save-blocking bug (CLI-165): an image/file
#    field whose stored value drifts outside its managed folder, or points at a
#    missing file, makes every Keystatic save of that page fail with
#    "a path was requested for deletion which does not exist".
# 2. unit-tests -- src/lib/url.ts (CLI-173) and the shortlink case aliases
#    (CLI-199). toEmbedUrl() rewrites editor-supplied
#    video links into framable /embed/ form, and a silent regression there breaks
#    every keynote clip and the speaker reel. Also asserts an unsafe URL can never
#    become embeddable.
# 3. shortlinks -- CLI-202: a shortlink whose slug collides with a real page is
#    skipped at build so the page wins, but from the Keystatic admin it still
#    looks saved and active. Without this check the only signal is a console.warn
#    in the build log, and the link the editor just handed out 404s.
#
# main is where Keystatic Cloud commits content directly, so both run there too.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  keystatic-images:
    name: Keystatic image/file paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # Only production deps are needed (the validator imports @keystatic/core);
      # skipping devDependencies keeps the run fast.
      - run: npm ci --omit=dev
      - run: npm run validate:content

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # The test imports only src/lib/url.ts (Node builtins, no packages), so
      # production deps are all it needs; --omit=dev keeps the run fast.
      - run: npm ci --omit=dev
      - run: npm run test:unit

  shortlinks:
    name: Shortlinks resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # Reads the links collection through @keystatic/core, same as the
      # image validator above, so production deps are enough.
      - run: npm ci --omit=dev
      - run: npm run validate:shortlinks
